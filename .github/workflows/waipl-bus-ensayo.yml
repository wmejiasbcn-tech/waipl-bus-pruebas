name: WAIPL-BUS ensayo del receptor (aislado, sin NVIDIA)

# Hark, 24-10-2026. Prueba REAL en GitHub Actions, sin fusionar en main y sin llave de NVIDIA.
# Corre en la propia PR (rama hark/receptor-nvidia). Solo datos inventados.
# 1) Ejecuta todas las pruebas simuladas en Actions.  2) Simulacro real del apagado con la etiqueta bus:kill.
on:
  pull_request:
    paths: ['.github/waipl-bus/**', '.github/workflows/waipl-bus-*.yml']
  workflow_dispatch:

concurrency:
  group: waipl-bus-ensayo
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas simuladas (portero + receptor)
        run: |
          node --test --test-reporter=spec .github/waipl-bus/test/ 2>&1 | tee pruebas.txt
          { echo '## Pruebas simuladas ejecutadas en GitHub Actions'; echo '```'; grep -E '^ℹ (tests|pass|fail)' pruebas.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  simulacro-apagado:
    needs: pruebas
    # Con llave, solo a mano (workflow_dispatch) o en la PR de la misma rama: nunca desde forks.
    if: github.repository == 'wmejiasbcn-tech/waipl-bus-pruebas' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/waipl-bus
          persist-credentials: false
      - name: Simulacro real del apagado (sin NVIDIA_API_KEY)
        uses: actions/github-script@v7
        env:
          BUS_KILL: ${{ vars.BUS_KILL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          script: |
            const dir = process.env.GITHUB_WORKSPACE + '/.github/waipl-bus/';
            const sim = require(dir + 'ensayo/simulacro.js');
            const r = await sim.run({ github, context, core, dir, varValue: process.env.BUS_KILL, nvidiaKey: process.env.NVIDIA_API_KEY || '' });
            core.info(JSON.stringify(r, null, 2));
            if (!r.ok) core.setFailed('El simulacro no cumple algún criterio: ' + r.fallos.join(' | '));
